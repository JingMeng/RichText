apply plugin: 'com.android.application'

android {
    namespace 'zhou.demo'
    compileSdk 34
    defaultConfig {
        applicationId "zhou.demo"
        minSdk 15
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    
    }
    lintOptions {
        abortOnError false
    }
    productFlavors {
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    testImplementation 'junit:junit:4.12'
    implementation 'com.android.support:appcompat-v7:26.1.0'
    implementation 'com.android.support:recyclerview-v7:26.1.0'
    implementation project(':richtext')
    implementation project(':okhttpimagedownloader')
    //    compile 'com.zzhoujay.richtext:richtext:2.6.0'
    //    compile 'com.zzhoujay.okhttpimagedownloader:OkHttpImageDownloader:1.0.0'
}




