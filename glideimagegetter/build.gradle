apply plugin: 'com.android.library'
apply plugin: 'com.novoda.bintray-release'

def version_code = 6
def version_name = "1.0.5"

android {
    compileSdk 34

    defaultConfig {
        minSdk 14
        targetSdk 34
        versionCode version_code
        versionName version_name

        resourcePrefix "zhou_glide_"


        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    
    }
    lintOptions {
        abortOnError false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    testImplementation 'junit:junit:4.12'
    implementation 'com.github.bumptech.glide:glide:3.7.0'
    implementation 'com.zzhoujay.richtext:richtext:2.5.+'
//    compile project(':richtext')
}

publish {

    Properties properties = new Properties()
    properties.load(project.rootProject.file('local.properties').newDataInputStream())
    //bintray.com?????    userOrg = properties.getProperty("bintray.user")
    //jcenter??????
    groupId = "com.zzhoujay.glideimagegetter"
    //??????
    artifactId = 'glideimagegetter'
    //?????    publishVersion = version_name
    //?????????
    desc = 'RichText??lide????????????'
    //?????????
    website = 'https://github.com/zzhoujay/RichTex'

    bintrayUser = properties.getProperty("bintray.user")
    bintrayKey = properties.getProperty("bintray.apikey")

}


